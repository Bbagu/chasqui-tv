<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Noticias — Chasqui TV Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { amarillo: '#F5C400', rojo: '#CC1818', negro: '#111111', gris: '#F8F8F8' },
          fontFamily: { bebas: ['Bebas Neue', 'sans-serif'], barlow: ['Barlow', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-gris font-barlow flex min-h-screen" x-data="noticiasManager()">

  <!-- Sidebar -->
  <aside class="w-64 bg-negro text-white flex flex-col fixed inset-y-0 shadow-2xl z-50">
    <div class="p-6 bg-amarillo flex justify-center border-b-4 border-negro">
      <img src="../CHASQUI TV LOGO ORIGINAL.png" alt="Chasqui TV" class="h-10 object-contain">
    </div>
    <nav class="flex-1 p-4 space-y-2 mt-4">
      <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition">📊 Dashboard</a>
      <a href="noticias.html" class="flex items-center gap-3 px-4 py-3 bg-amarillo text-negro font-bold rounded-lg transition">📰 Noticias</a>
      <a href="categorias.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition">📁 Categorías</a>
      <a href="banners.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition">🖼️ Banners</a>
    </nav>
    <div class="p-4 border-t border-white/10 mt-auto">
      <button @click="logout" class="w-full flex items-center gap-3 px-4 py-3 text-rojo hover:bg-rojo hover:text-white rounded-lg transition font-bold uppercase text-xs tracking-widest">
        🚪 Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 ml-64 p-8">
    <header class="flex justify-between items-center mb-8">
      <div>
        <h2 class="font-bebas text-4xl text-negro uppercase">Gestión de Noticias</h2>
        <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Publica y edita el contenido del portal</p>
      </div>
      <a href="nueva-noticia.html" class="bg-rojo text-white font-bebas text-xl px-6 py-2 rounded hover:bg-negro transition flex items-center gap-2 shadow-lg">
        <span>+</span> NUEVA NOTICIA
      </a>
    </header>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead class="bg-gray-50 border-b border-gray-100">
            <tr>
              <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Noticia</th>
              <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Categoría</th>
              <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Estado</th>
              <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-right">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-50">
            <template x-for="noticia in noticias" :key="noticia.id">
              <tr class="hover:bg-gray-50 transition">
                <td class="px-6 py-4">
                  <div class="flex items-center gap-3">
                    <img :src="noticia.imagen_url || 'https://via.placeholder.com/80x50'" class="w-12 h-8 object-cover rounded bg-gray-200">
                    <span class="font-bold text-sm text-negro line-clamp-1" x-text="noticia.titulo"></span>
                  </div>
                </td>
                <td class="px-6 py-4">
                  <span class="text-[10px] font-bold uppercase px-2 py-1 rounded bg-gray-100 text-gray-500" x-text="noticia.categorias?.nombre || 'General'"></span>
                </td>
                <td class="px-6 py-4">
                  <span :class="{
                    'bg-green-100 text-green-600': noticia.estado === 'publicado',
                    'bg-yellow-100 text-yellow-600': noticia.estado === 'borrador',
                    'bg-blue-100 text-blue-600': noticia.estado === 'revision'
                  }" class="text-[10px] font-bold uppercase px-2 py-1 rounded" x-text="noticia.estado"></span>
                </td>
                <td class="px-6 py-4 text-right space-x-2 text-lg">
                  <button @click="editarNoticia(noticia.id)" class="text-gray-400 hover:text-negro transition" title="Editar">✏️</button>
                  <button @click="eliminarNoticia(noticia.id)" class="text-gray-400 hover:text-rojo transition" title="Eliminar">🗑️</button>
                </td>
              </tr>
            </template>
            <template x-if="noticias.length === 0">
              <tr>
                <td colspan="4" class="px-6 py-20 text-center">
                  <p class="text-gray-400 text-sm font-bold uppercase tracking-widest" x-text="loading ? 'Cargando noticias...' : 'No hay noticias aún'"></p>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../assets/js/supabase.js"></script>
  <script>
    function noticiasManager() {
      return {
        noticias: [],
        loading: true,
        async init() {
          const { data: { session } } = await window.supabase.auth.getSession();
          if (!session) { window.location.href = 'login.html'; return; }
          this.fetchNoticias();
        },
        async fetchNoticias() {
          this.loading = true;
          const { data, error } = await window.supabase
            .from('noticias')
            .select('*, categorias(nombre)')
            .order('created_at', { ascending: false });
          if (!error) this.noticias = data;
          this.loading = false;
        },
        async eliminarNoticia(id) {
          if (!confirm('¿Seguro que quieres eliminar esta noticia?')) return;
          const { error } = await window.supabase.from('noticias').delete().eq('id', id);
          if (!error) this.fetchNoticias();
          else alert('Error: ' + error.message);
        },
        editarNoticia(id) {
          window.location.href = `nueva-noticia.html?id=${id}`;
        },
        async logout() {
          await window.supabase.auth.signOut();
          window.location.href = 'login.html';
        }
      }
    }
  </script>
</body>
</html>
