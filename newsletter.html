<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chasqui News — Suscripción al Newsletter</title>
  
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amarillo: '#F5C400',
            rojo: '#CC1818',
            negro: '#111111',
            grisOsc: '#1E1E1E',
          },
          fontFamily: {
            bebas: ['Bebas Neue', 'sans-serif'],
            barlow: ['Barlow', 'sans-serif'],
            condensed: ['Barlow Condensed', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 font-barlow text-negro min-h-screen flex flex-col">

  <!-- HEADER SIMPLIFICADO -->
  <header class="bg-negro py-6 border-b-4 border-amarillo">
    <div class="max-w-7xl mx-auto px-6 flex justify-center">
      <a href="index.html">
        <img src="CHASQUI TV LOGO ORIGINAL.png" alt="Chasqui TV Logo" class="h-16 w-auto object-contain">
      </a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-6 py-20">
    <div class="bg-white max-w-lg w-full rounded-lg shadow-2xl overflow-hidden grid grid-cols-1">
      
      <!-- Banner decorativo -->
      <div class="bg-rojo py-4 px-8 flex items-center justify-between">
        <h2 class="font-bebas text-white text-2xl tracking-wide">CHASQUI NEWS</h2>
        <span class="text-amarillo text-2xl">📧</span>
      </div>

      <div class="p-8 md:p-12 space-y-6">
        <div class="text-center space-y-2">
          <h3 class="font-bebas text-4xl text-negro leading-tight">Infórmate primero</h3>
          <p class="text-gray-500 text-sm leading-relaxed">Únete a nuestra comunidad y recibe cada mañana un resumen con las noticias más impactantes del Ecuador y el mundo.</p>
        </div>

        <!-- Formulario -->
        <form class="space-y-4">
          <div class="space-y-1">
            <label class="font-condensed text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Tu nombre</label>
            <input type="text" placeholder="Ej. Juan Pérez" class="w-full bg-gray-50 border border-gray-200 px-4 py-3 rounded outline-none focus:border-amarillo transition">
          </div>
          <div class="space-y-1">
            <label class="font-condensed text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Correo electrónico</label>
            <input type="email" placeholder="tu@correo.com" class="w-full bg-gray-50 border border-gray-200 px-4 py-3 rounded outline-none focus:border-amarillo transition">
          </div>
          
          <div class="flex items-start gap-3 pt-2">
            <input type="checkbox" id="terms" class="mt-1 accent-rojo">
            <label for="terms" class="text-[10px] text-gray-400 leading-tight uppercase font-bold tracking-tighter">Acepto la política de privacidad y el envío de correos informativos.</label>
          </div>

          <button type="submit" class="w-full bg-negro text-amarillo font-bebas text-2xl py-3 rounded hover:bg-rojo hover:text-white transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg">
            ¡SUSCRIBIRME AHORA!
          </button>
        </form>

        <p class="text-center text-[10px] text-gray-400 font-bold uppercase tracking-widest">
          Sin spam. Puedes darte de baja en cualquier momento.
        </p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="py-10 text-center">
    <a href="index.html" class="font-bebas text-gray-400 hover:text-negro transition tracking-widest text-sm">← Volver al inicio</a>
    <p class="text-[10px] text-gray-300 mt-4 font-bold uppercase">© 2025 Chasqui TV Digital</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/main.js"></script>
  <!-- SDK de EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function(){
        // Reemplaza con tu Public Key de EmailJS
        // emailjs.init("YOUR_PUBLIC_KEY");
    })();
  </script>
</body>
</html>
